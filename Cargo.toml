[package]
name = "memonotes"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "memonotes"
path = "src/main.rs"
required-features = ["gtk-ui"]

[features]
default = []
gtk-ui = ["dep:libadwaita"]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
libadwaita = { version = "0.8", features = ["v1_5"], optional = true }

[dev-dependencies]
tempfile = "3"